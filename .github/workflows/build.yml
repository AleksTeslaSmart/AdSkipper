# Собирает APK на серверах GitHub и выкладывает его в Releases.
# Постоянная ссылка для телефона:
#   https://github.com/AleksTeslaSmart/AdSkipper/releases/latest/download/AdSkipper.apk
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE — ключ подписи в base64
#   SIGNING_PASSWORD — пароль ключа
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::error::Secret SIGNING_KEYSTORE is missing. Without a permanent key, updates won't install over the old version."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/adskipper.p12"

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/adskipper.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk AdSkipper.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AdSkipper v1.0.${{ github.run_number }}
          body: Откройте эту страницу на Android-телефоне и скачайте AdSkipper.apk
          files: AdSkipper.apk
          make_latest: true
